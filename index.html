<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
<title>ITパス用語クイズ</title>
<style>
  /* ===== 色設定（ライト） ===== */
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --text: #1d2130;
    --sub: #626a7f;
    --line: #dde1ea;
    --accent: #3b6ef5;
    --accent-text: #ffffff;
    --ok: #1f9d55;
    --ok-bg: #e3f6ea;
    --ng: #d64545;
    --ng-bg: #fde8e8;
    --cat-S: #8a5cf6;
    --cat-M: #e08a00;
    --cat-T: #0c9bb8;
  }
  /* ===== 色設定（ダーク） ===== */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c;
      --card: #1f222b;
      --text: #e9ebf1;
      --sub: #9aa1b3;
      --line: #343846;
      --accent: #6b93ff;
      --accent-text: #0f1320;
      --ok: #4cd38a;
      --ok-bg: #173527;
      --ng: #ff7b7b;
      --ng-bg: #3a1d1f;
      --cat-S: #b195ff;
      --cat-M: #ffb84d;
      --cat-T: #4fd2ec;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.6;
    touch-action: manipulation; /* ダブルタップ拡大を防ぐ */
  }
  #app {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
    min-height: 100dvh;
  }
  h1 { font-size: 1.35rem; margin: 8px 0 4px; }
  .lead { color: var(--sub); font-size: .9rem; margin: 0 0 16px; }
  [hidden] { display: none !important; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .label { font-size: .85rem; color: var(--sub); font-weight: 700; margin-bottom: 8px; }

  /* ===== セグメント型の選択UI ===== */
  .seg { display: grid; gap: 8px; }
  .seg.c2 { grid-template-columns: 1fr 1fr; }
  .seg.c3 { grid-template-columns: 1fr 1fr 1fr; }
  .seg.c4 { grid-template-columns: repeat(4, 1fr); }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label {
    display: flex; align-items: center; justify-content: center; text-align: center;
    min-height: 48px; padding: 6px 4px;
    border: 1.5px solid var(--line); border-radius: 12px;
    font-size: .92rem; font-weight: 600; cursor: pointer;
    background: var(--bg);
    user-select: none;
  }
  .seg input:checked + label {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-text);
  }
  .seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }

  .info { font-size: .88rem; color: var(--sub); margin-top: 10px; }
  .warn { color: var(--ng); font-size: .9rem; margin-top: 8px; }

  /* ===== ボタン ===== */
  .btn {
    display: block; width: 100%;
    min-height: 56px; padding: 12px 16px;
    border: none; border-radius: 14px;
    font-size: 1.05rem; font-weight: 700; font-family: inherit;
    background: var(--accent); color: var(--accent-text);
    cursor: pointer;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .45; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .btn.small { min-height: 40px; font-size: .88rem; padding: 6px 12px; width: auto; display: inline-block; }
  .btn + .btn { margin-top: 10px; }
  .link-btn { background: none; border: none; color: var(--sub); font-size: .85rem; text-decoration: underline; padding: 8px 0; cursor: pointer; font-family: inherit; }

  /* ===== クイズ画面 ===== */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .progress-text { font-weight: 700; font-size: .95rem; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .25s; }

  .badge {
    display: inline-block; font-size: .75rem; font-weight: 700;
    padding: 2px 10px; border-radius: 999px; color: #fff;
  }
  .badge.S { background: var(--cat-S); }
  .badge.M { background: var(--cat-M); }
  .badge.T { background: var(--cat-T); }
  @media (prefers-color-scheme: dark) { .badge { color: #10131a; } }

  .question { min-height: 120px; display: flex; flex-direction: column; justify-content: center; }
  .q-main { font-weight: 800; margin: 8px 0 0; word-break: break-word; }
  .q-main.term { font-size: 1.9rem; line-height: 1.3; }
  .q-main.meaning { font-size: 1.05rem; font-weight: 600; }
  .q-hint { color: var(--sub); font-size: .85rem; margin-top: 4px; }
  .q-prompt { color: var(--sub); font-size: .85rem; margin-top: 10px; }

  .choices { display: grid; gap: 10px; }
  .choice {
    width: 100%; min-height: 64px; padding: 12px 14px;
    text-align: left; font-family: inherit; font-size: .95rem; line-height: 1.5;
    color: var(--text); background: var(--card);
    border: 2px solid var(--line); border-radius: 14px;
    cursor: pointer;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .choice.term-choice { font-size: 1.15rem; font-weight: 700; align-items: center; }
  .choice .num {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--bg); border: 1px solid var(--line);
    font-size: .8rem; font-weight: 700; color: var(--sub);
  }
  .choice:active:not(:disabled) { transform: scale(.985); }
  .choice:disabled { cursor: default; }
  .choice.correct { border-color: var(--ok); background: var(--ok-bg); }
  .choice.wrong { border-color: var(--ng); background: var(--ng-bg); }
  .choice.dim { opacity: .55; }

  .feedback { margin-top: 14px; border-radius: 14px; padding: 14px; border: 2px solid; }
  .feedback.ok { border-color: var(--ok); background: var(--ok-bg); }
  .feedback.ng { border-color: var(--ng); background: var(--ng-bg); }
  .fb-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 6px; }
  .feedback.ok .fb-title { color: var(--ok); }
  .feedback.ng .fb-title { color: var(--ng); }
  .fb-term { font-weight: 800; font-size: 1.05rem; }
  .fb-full { color: var(--sub); font-size: .88rem; margin-bottom: 6px; }
  .fb-meaning { font-size: .95rem; }
  .fb-note { font-size: .82rem; margin-top: 8px; color: var(--sub); }
  #nextBtn { margin-top: 14px; position: sticky; bottom: calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 4px 16px rgba(0,0,0,.18); }

  /* ===== 結果画面 ===== */
  .score { text-align: center; }
  .score .rate { font-size: 3rem; font-weight: 800; line-height: 1.1; }
  .score .detail { color: var(--sub); }
  .wrong-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .wrong-item:last-child { border-bottom: none; }
  .wrong-item .t { font-weight: 800; }
  .wrong-item .f { color: var(--sub); font-size: .8rem; }
  .wrong-item .m { font-size: .9rem; }
</style>
</head>
<body>
<div id="app">

  <!-- ===================== ホーム画面 ===================== -->
  <section id="home">
    <h1>ITパスポート 用語クイズ</h1>
    <p class="lead">四択で用語を覚えよう。間違えた用語は自動で「苦手」に入るよ。</p>

    <div class="card">
      <div class="label">出題モード</div>
      <div class="seg c2">
        <input type="radio" name="mode" id="mode-tm" value="term2meaning" checked><label for="mode-tm">用語 → 意味</label>
        <input type="radio" name="mode" id="mode-mt" value="meaning2term"><label for="mode-mt">意味 → 用語</label>
      </div>
    </div>

    <div class="card">
      <div class="label">出題範囲</div>
      <div class="seg c2">
        <input type="radio" name="scope" id="scope-all" value="all" checked><label for="scope-all">全用語</label>
        <input type="radio" name="scope" id="scope-weak" value="weak"><label for="scope-weak">苦手だけ復習</label>
      </div>
      <div class="info" id="weakInfo"></div>
    </div>

    <div class="card">
      <div class="label">分野</div>
      <div class="seg c4">
        <input type="radio" name="cat" id="cat-all" value="all" checked><label for="cat-all">全分野</label>
        <input type="radio" name="cat" id="cat-S" value="S"><label for="cat-S">ストラ<br>テジ</label>
        <input type="radio" name="cat" id="cat-M" value="M"><label for="cat-M">マネジ<br>メント</label>
        <input type="radio" name="cat" id="cat-T" value="T"><label for="cat-T">テクノ<br>ロジ</label>
      </div>
    </div>

    <div class="card">
      <div class="label">出題数</div>
      <div class="seg c3">
        <input type="radio" name="count" id="cnt-10" value="10" checked><label for="cnt-10">10問</label>
        <input type="radio" name="count" id="cnt-20" value="20"><label for="cnt-20">20問</label>
        <input type="radio" name="count" id="cnt-all" value="all"><label for="cnt-all">全問</label>
      </div>
      <div class="info" id="poolInfo"></div>
      <div class="warn" id="poolWarn" hidden></div>
    </div>

    <button class="btn" id="startBtn">スタート</button>
    <div style="text-align:center;margin-top:12px">
      <button class="link-btn" id="resetWeakBtn">苦手リストをリセット</button>
    </div>
  </section>

  <!-- ===================== クイズ画面 ===================== -->
  <section id="quiz" hidden>
    <div class="topbar">
      <span class="progress-text" id="progressText">1 / 10</span>
      <button class="btn ghost small" id="quitBtn">やめる</button>
    </div>
    <div class="bar"><div id="progressBar"></div></div>

    <div class="card question">
      <div><span class="badge" id="qBadge"></span></div>
      <div class="q-main" id="qMain"></div>
      <div class="q-hint" id="qHint"></div>
      <div class="q-prompt" id="qPrompt"></div>
    </div>

    <div class="choices" id="choices"></div>

    <div id="feedback" hidden></div>
    <button class="btn" id="nextBtn" hidden>次へ</button>
  </section>

  <!-- ===================== 結果画面 ===================== -->
  <section id="result" hidden>
    <h1>結果</h1>
    <div class="card score">
      <div class="rate" id="rate">0%</div>
      <div class="detail" id="rateDetail"></div>
    </div>
    <div class="card" id="wrongCard">
      <div class="label">間違えた用語</div>
      <div id="wrongList"></div>
    </div>
    <button class="btn" id="retryWrongBtn">間違えた用語だけもう一度</button>
    <button class="btn ghost" id="homeBtn">ホームへ戻る</button>
  </section>

</div>

<script>
/* =========================================================
   単語データ
   - 追加するときはこの配列に1件ずつ足すだけでOK
   - id     : 一意なID（重複NG。localStorageのキーに使う）
   - term   : 表示する用語
   - full   : 正式名称（略語は英語のフルスペル）
   - cat    : 分野  S=ストラテジ / M=マネジメント / T=テクノロジ
   - group  : 細かいグループ。同じグループの用語を優先してダミー選択肢にする（紛らわしくするため）
   - meaning: 意味（1〜2文）
   - hint   : 同じ略語が複数あるときなど、出題時に添える補足（任意）
   ========================================================= */
const TERMS = [
  // ---------- ストラテジ系 ----------
  { id: "accountability", term: "アカウンタビリティ", full: "Accountability（説明責任）", cat: "S", group: "企業経営",
    meaning: "企業などが株主や利害関係者に対して、経営活動の内容や結果、財務状況などを説明する責任。" },
  { id: "ir", term: "IR", full: "Investor Relations（インベスターリレーションズ）", cat: "S", group: "企業経営",
    meaning: "企業が株主や投資家に向けて、経営状況や財務情報などを適時・公平に発信する広報活動。" },
  { id: "csr", term: "CSR", full: "Corporate Social Responsibility（企業の社会的責任）", cat: "S", group: "企業経営",
    meaning: "企業が利益の追求だけでなく、法令遵守や環境保護、社会貢献など、社会の一員として果たすべき責任。" },
  { id: "ipo", term: "IPO", full: "Initial Public Offering（新規株式公開）", cat: "S", group: "企業経営",
    meaning: "未上場の企業が証券取引所に株式を上場し、一般の投資家が株式を売買できるようにすること。" },
  { id: "competency", term: "コンピテンシ", full: "Competency", cat: "S", group: "人材",
    meaning: "高い成果を上げる人材に共通して見られる行動特性。人材の採用・評価・育成の基準として用いられる。" },
  { id: "rfm", term: "RFM分析", full: "Recency（最終購買日）, Frequency（購買頻度）, Monetary（累計購買金額）", cat: "S", group: "分析手法",
    meaning: "最終購買日、購買頻度、累計購買金額の3つの指標で顧客をランク付けし、優良顧客などを見極める分析手法。" },
  { id: "cohort", term: "コホート分析", full: "Cohort Analysis", cat: "S", group: "分析手法",
    meaning: "同じ時期に同じ経験をした集団（例：同じ月に初めて購入した顧客）ごとに分け、その後の行動の変化を時系列で比較する分析手法。" },
  { id: "roe", term: "ROE", full: "Return On Equity（自己資本利益率）", cat: "S", group: "財務指標",
    meaning: "当期純利益を自己資本で割った値。株主が出資した資本を使って、どれだけ効率よく利益を上げたかを示す。" },
  { id: "roi", term: "ROI", full: "Return On Investment（投資利益率）", cat: "S", group: "財務指標",
    meaning: "投資によって得られた利益を投資額で割った値。投資した金額に対してどれだけ利益が出たかを評価する指標。" },
  { id: "per", term: "PER", full: "Price Earnings Ratio（株価収益率）", cat: "S", group: "財務指標",
    meaning: "株価を1株当たり純利益で割った値。株価が企業の利益に対して割高か割安かを判断する指標。" },
  { id: "roa", term: "ROA", full: "Return On Assets（総資産利益率）", cat: "S", group: "財務指標",
    meaning: "利益を総資産で割った値。企業が保有する資産全体を使って、どれだけ効率よく利益を上げたかを示す。" },
  { id: "alliance", term: "アライアンス", full: "Alliance（業務提携）", cat: "S", group: "経営戦略",
    meaning: "複数の企業が互いの独立性を保ったまま、技術・生産・販売などの分野で協力関係を結ぶこと。" },
  { id: "ppm", term: "PPM", full: "Product Portfolio Management", cat: "S", group: "経営戦略",
    meaning: "市場成長率と市場占有率の2軸で自社の事業や製品を「花形」「金のなる木」「問題児」「負け犬」に分類し、経営資源の配分を検討する手法。" },
  { id: "bsc", term: "BSC", full: "Balanced Scorecard（バランススコアカード）", cat: "S", group: "経営戦略",
    meaning: "「財務」「顧客」「業務プロセス」「学習と成長」の4つの視点から、戦略を具体的な目標や指標に落とし込んで業績を評価する手法。" },
  { id: "csf", term: "CSF", full: "Critical Success Factor（重要成功要因）", cat: "S", group: "経営戦略",
    meaning: "経営戦略や目標を達成するうえで、決定的な影響を与える重要な要因。" },
  { id: "4c", term: "4C", full: "Customer Value（顧客価値）, Cost（顧客コスト）, Convenience（利便性）, Communication（コミュニケーション）", cat: "S", group: "マーケティング",
    meaning: "顧客の視点からマーケティングを考える枠組み。売り手視点の4P（製品・価格・流通・販促）に対応する4つの要素からなる。" },
  { id: "plc-product", term: "PLC", hint: "マーケティング分野", full: "Product Life Cycle（プロダクトライフサイクル）", cat: "S", group: "マーケティング",
    meaning: "製品が市場に投入されてから撤退するまでを、導入期・成長期・成熟期・衰退期の4段階で捉える考え方。" },
  { id: "crm", term: "CRM", full: "Customer Relationship Management（顧客関係管理）", cat: "S", group: "経営管理システム",
    meaning: "顧客情報を一元管理して顧客との長期的な関係を築き、顧客満足度や収益の向上を図る経営手法。" },
  { id: "erp", term: "ERP", full: "Enterprise Resource Planning（企業資源計画）", cat: "S", group: "経営管理システム",
    meaning: "企業の経営資源（ヒト・モノ・カネ・情報）を統合的に管理して有効活用を図る考え方。また、それを実現する統合業務パッケージ。" },
  { id: "mrp", term: "MRP", full: "Material Requirements Planning（資材所要量計画）", cat: "S", group: "生産",
    meaning: "生産計画をもとに、必要な部品や資材の量と発注の時期を算出する生産管理の手法。" },
  { id: "jit", term: "JIT生産方式", full: "Just In Time（ジャストインタイム）", cat: "S", group: "生産",
    meaning: "必要なものを、必要なときに、必要な量だけ生産・調達することで、在庫を最小限に抑える生産方式。" },
  { id: "cad", term: "CAD", full: "Computer Aided Design", cat: "S", group: "生産",
    meaning: "コンピュータを使って、製品や建築物などの設計・製図を行うこと。また、そのためのシステム。" },
  { id: "cam", term: "CAM", full: "Computer Aided Manufacturing", cat: "S", group: "生産",
    meaning: "設計データなどをもとに、コンピュータで工作機械を制御して製造を行うこと。また、そのためのシステム。" },
  { id: "bcp", term: "BCP", full: "Business Continuity Plan（事業継続計画）", cat: "S", group: "事業継続",
    meaning: "災害や事故などの緊急事態に備えて、重要な事業を継続または早期に復旧させるための方針や手順をあらかじめ定めた計画。" },
  { id: "bcm", term: "BCM", full: "Business Continuity Management（事業継続管理）", cat: "S", group: "事業継続",
    meaning: "事業継続計画の策定だけでなく、教育・訓練、点検、見直しまでを継続的に行い、事業継続能力を維持・改善していく経営管理の活動。" },
  { id: "gdpr", term: "GDPR", full: "General Data Protection Regulation（EU一般データ保護規則）", cat: "S", group: "法務",
    meaning: "EU域内の個人データの保護を目的とした規則。EU域外の企業でも、EU域内の個人のデータを扱う場合は適用対象となる。" },
  { id: "iso9000", term: "ISO 9000", full: "ISO 9000シリーズ（品質マネジメントシステム）", cat: "S", group: "標準化",
    meaning: "製品やサービスの品質を管理・改善するための、品質マネジメントシステムに関する国際規格群。" },
  { id: "iso14000", term: "ISO 14000", full: "ISO 14000シリーズ（環境マネジメントシステム）", cat: "S", group: "標準化",
    meaning: "企業活動が環境に与える影響を管理・低減するための、環境マネジメントシステムに関する国際規格群。" },
  { id: "cgm", term: "CGM", full: "Consumer Generated Media", cat: "S", group: "eビジネス",
    meaning: "ブログやSNS、口コミサイトなど、一般の消費者が情報を発信することでコンテンツが作られていくメディア。" },

   アプリ本体
   ========================================================= */
const CAT_NAME = { S: "ストラテジ", M: "マネジメント", T: "テクノロジ" };
const WEAK_KEY = "itp_quiz_weak_v1";   // 苦手リストの保存キー
const CLEAR_STREAK = 2;                // 連続この回数正解で苦手から外す

const $ = (id) => document.getElementById(id);
const byId = Object.fromEntries(TERMS.map(t => [t.id, t]));

// ---------- 苦手リスト（localStorage） ----------
// 形式: { 用語id: 連続正解数 }
function loadWeak() {
  try {
    const obj = JSON.parse(localStorage.getItem(WEAK_KEY) || "{}");
    // データから消えた用語は除外
    for (const k of Object.keys(obj)) if (!byId[k]) delete obj[k];
    return obj;
  } catch (e) { return {}; }
}
function saveWeak(obj) {
  try { localStorage.setItem(WEAK_KEY, JSON.stringify(obj)); } catch (e) { /* 保存できない環境では無視 */ }
}
let weak = loadWeak();

// ---------- ユーティリティ ----------
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function getRadio(name) {
  return document.querySelector(`input[name="${name}"]:checked`).value;
}
function show(sectionId) {
  for (const id of ["home", "quiz", "result"]) $(id).hidden = (id !== sectionId);
  window.scrollTo(0, 0);
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---------- ホーム画面 ----------
function currentPool() {
  const scope = getRadio("scope");
  const cat = getRadio("cat");
  return TERMS.filter(t =>
    (cat === "all" || t.cat === cat) &&
    (scope === "all" || weak[t.id] !== undefined)
  );
}
function refreshHome() {
  const weakCount = Object.keys(weak).length;
  $("weakInfo").textContent = `苦手リスト：${weakCount}語（${CLEAR_STREAK}回連続正解で卒業）`;
  const pool = currentPool();
  const countSel = getRadio("count");
  const n = countSel === "all" ? pool.length : Math.min(Number(countSel), pool.length);
  $("poolInfo").textContent = `対象 ${pool.length}語 → ${n}問出題`;
  const warn = $("poolWarn");
  if (pool.length === 0) {
    warn.hidden = false;
    warn.textContent = getRadio("scope") === "weak"
      ? "この条件の苦手用語はないよ。全用語モードで解いてみよう。"
      : "対象の用語がないよ。";
  } else {
    warn.hidden = true;
  }
  $("startBtn").disabled = pool.length === 0;
}
document.querySelectorAll("#home input").forEach(el => el.addEventListener("change", refreshHome));
$("startBtn").addEventListener("click", () => {
  const pool = currentPool();
  const countSel = getRadio("count");
  const n = countSel === "all" ? pool.length : Math.min(Number(countSel), pool.length);
  startQuiz(shuffle(pool).slice(0, n));
});
$("resetWeakBtn").addEventListener("click", () => {
  if (Object.keys(weak).length === 0) { alert("苦手リストは空だよ。"); return; }
  if (confirm("苦手リストを全部消す？（元に戻せません）")) {
    weak = {};
    saveWeak(weak);
    refreshHome();
  }
});

// ---------- クイズ ----------
const quiz = { items: [], idx: 0, correct: 0, wrong: [], mode: "term2meaning", answered: false };

// ダミー選択肢を3つ選ぶ：同じ分野から。同じグループを優先して紛らわしくする
function pickDistractors(item) {
  const pool = TERMS.filter(t =>
    t.cat === item.cat && t.id !== item.id && t.term !== item.term
  );
  const sameGroup = shuffle(pool.filter(t => t.group === item.group));
  const others = shuffle(pool.filter(t => t.group !== item.group));
  // 同グループから最大2つ、残りは同分野の他グループから（足りなければ相互に補う）
  const picked = sameGroup.slice(0, 2);
  for (const t of others) { if (picked.length >= 3) break; picked.push(t); }
  for (const t of sameGroup.slice(2)) { if (picked.length >= 3) break; picked.push(t); }
  return picked;
}

function startQuiz(items) {
  quiz.items = items;
  quiz.idx = 0;
  quiz.correct = 0;
  quiz.wrong = [];
  quiz.mode = getRadio("mode");
  show("quiz");
  renderQuestion();
}

function renderQuestion() {
  const item = quiz.items[quiz.idx];
  const total = quiz.items.length;
  quiz.answered = false;

  $("progressText").textContent = `${quiz.idx + 1} / ${total}`;
  $("progressBar").style.width = `${(quiz.idx / total) * 100}%`;

  const badge = $("qBadge");
  badge.className = `badge ${item.cat}`;
  badge.textContent = CAT_NAME[item.cat];

  const isT2M = quiz.mode === "term2meaning";
  const qMain = $("qMain");
  qMain.className = "q-main " + (isT2M ? "term" : "meaning");
  qMain.textContent = isT2M ? item.term : item.meaning;
  $("qHint").textContent = (isT2M && item.hint) ? `（${item.hint}）` : "";
  $("qPrompt").textContent = isT2M ? "この用語の意味は？" : "この説明に当てはまる用語は？";

  // 選択肢を作る
  const options = shuffle([item, ...pickDistractors(item)]);
  const box = $("choices");
  box.innerHTML = "";
  options.forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "choice" + (isT2M ? "" : " term-choice");
    b.dataset.id = opt.id;
    b.innerHTML = `<span class="num">${i + 1}</span><span>${esc(isT2M ? opt.meaning : opt.term)}</span>`;
    b.addEventListener("click", () => answer(opt.id));
    box.appendChild(b);
  });

  $("feedback").hidden = true;
  $("nextBtn").hidden = true;
}

function answer(selectedId) {
  if (quiz.answered) return;
  quiz.answered = true;
  const item = quiz.items[quiz.idx];
  const ok = selectedId === item.id;

  // ボタンの色付け
  document.querySelectorAll("#choices .choice").forEach(b => {
    b.disabled = true;
    if (b.dataset.id === item.id) b.classList.add("correct");
    else if (b.dataset.id === selectedId) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  // 苦手リストの更新
  let note = "";
  if (ok) {
    quiz.correct++;
    if (weak[item.id] !== undefined) {
      weak[item.id]++;
      if (weak[item.id] >= CLEAR_STREAK) {
        delete weak[item.id];
        note = "🎉 連続正解で苦手リストから卒業！";
      } else {
        note = `苦手リスト：連続正解 ${weak[item.id]} / ${CLEAR_STREAK}`;
      }
    }
  } else {
    quiz.wrong.push(item);
    weak[item.id] = 0;  // 間違えたら連続正解数をリセット
    note = "苦手リストに追加したよ";
  }
  saveWeak(weak);

  // 解説表示
  const fb = $("feedback");
  fb.className = "feedback " + (ok ? "ok" : "ng");
  fb.innerHTML = `
    <div class="fb-title">${ok ? "⭕ 正解！" : "❌ 不正解"}</div>
    <div class="fb-term">${esc(item.term)}</div>
    <div class="fb-full">${esc(item.full)}</div>
    <div class="fb-meaning">${esc(item.meaning)}</div>
    ${note ? `<div class="fb-note">${esc(note)}</div>` : ""}
  `;
  fb.hidden = false;

  const next = $("nextBtn");
  next.textContent = quiz.idx + 1 >= quiz.items.length ? "結果を見る" : "次へ";
  next.hidden = false;
  $("progressBar").style.width = `${((quiz.idx + 1) / quiz.items.length) * 100}%`;
  // 解説が見えるようにスクロール
  fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

$("nextBtn").addEventListener("click", () => {
  quiz.idx++;
  if (quiz.idx >= quiz.items.length) showResult();
  else { renderQuestion(); window.scrollTo(0, 0); }
});

$("quitBtn").addEventListener("click", () => {
  const done = quiz.idx + (quiz.answered ? 1 : 0);
  if (done === 0) { refreshHome(); show("home"); return; }
  if (confirm("ここまでの結果を表示して終了する？")) {
    quiz.items = quiz.items.slice(0, done);
    showResult();
  }
});

// ---------- 結果画面 ----------
function showResult() {
  const total = quiz.items.length;
  const rate = total ? Math.round((quiz.correct / total) * 100) : 0;
  $("rate").textContent = `${rate}%`;
  $("rateDetail").textContent = `${total}問中 ${quiz.correct}問正解`;

  const list = $("wrongList");
  if (quiz.wrong.length === 0) {
    list.innerHTML = `<div class="info">全問正解！🎉</div>`;
    $("retryWrongBtn").hidden = true;
  } else {
    list.innerHTML = quiz.wrong.map(t => `
      <div class="wrong-item">
        <div class="t">${esc(t.term)} <span class="badge ${t.cat}">${CAT_NAME[t.cat]}</span></div>
        <div class="f">${esc(t.full)}</div>
        <div class="m">${esc(t.meaning)}</div>
      </div>`).join("");
    $("retryWrongBtn").hidden = false;
  }
  show("result");
}
$("retryWrongBtn").addEventListener("click", () => startQuiz(shuffle(quiz.wrong)));
$("homeBtn").addEventListener("click", () => { refreshHome(); show("home"); });

// ---------- 起動 ----------
refreshHome();
</script>
</body>
</html>
